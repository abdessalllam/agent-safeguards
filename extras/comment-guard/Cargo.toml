[package]
name = "comment-guard"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"

[[bin]]
name = "comment-guard"
path = "src/main.rs"

[dependencies]
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"
