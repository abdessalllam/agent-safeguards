[workspace]
resolver = "2"
members = ["guard-common", "safe-tool", "delete-guard"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"

[workspace.dependencies]
serde_json = { version = "=1.0.151", default-features = false, features = ["std", "arbitrary_precision", "unbounded_depth"] }
regex = "=1.13.1"
libc = "=0.2.190"
guard-common = { path = "guard-common" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"
